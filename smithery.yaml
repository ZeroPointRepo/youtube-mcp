# Smithery configuration for TranscriptAPI MCP
# https://smithery.ai
#
# This MCP is a remote server hosted at https://transcriptapi.com/mcp.
# Smithery users can connect directly to the remote endpoint: no local install required.

startCommand:
  type: http
  url: https://transcriptapi.com/mcp
  description: >-
    The fastest YouTube transcript + YouTube search MCP for AI agents. 12 tools
    for transcripts, captions, video search, channel and playlist data, Shorts and
    live streams. Remote MCP server, no install, works with Claude, ChatGPT,
    Cursor and 20+ clients. Try for free.

metadata:
  homepage: https://transcriptapi.com
  documentation: https://transcriptapi.com/docs
  tags:
    - youtube
    - youtube-transcript
    - youtube-search
    - transcript
    - transcripts
    - subtitles
    - captions
    - video
    - playlist
    - channel
    - ai-agents
    - remote-mcp
